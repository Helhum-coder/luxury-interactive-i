# Docker Compose for Local Development and Production
version: '3.8'

services:
  # =============================================================================
  # APPLICATION SERVICE
  # =============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_ENV: ${APP_ENV:-development}
        DEPLOYMENT_PLATFORM: docker
        HELHUM_EMAIL: helhum@hotmail.com
        HELHUM_GITHUB: Helhum-coder
        HELBS_EMAIL: helbslozroj@gmail.com
        HELBS_GITHUB: HelbsLozroj
    ports:
      - "3000:3000"
    environment:
      # Team Configuration
      - HELHUM_EMAIL=helhum@hotmail.com
      - HELHUM_GITHUB=Helhum-coder
      - HELBS_EMAIL=helbslozroj@gmail.com
      - HELBS_GITHUB=HelbsLozroj
      
      # Application
      - APP_ENV=${APP_ENV:-development}
      - DEPLOYMENT_PLATFORM=docker
      - APP_URL=${APP_URL:-http://localhost:3000}
      - API_BASE_URL=${API_BASE_URL:-http://localhost:3000/api}
      
      # Database
      - DATABASE_URL=${DATABASE_URL:-postgresql://spark:password@db:5432/spark_db}
      - DATABASE_SSL=false
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      
      # Authentication
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-dev-nextauth-secret}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      
      # API Keys (from .env file)
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - LINEAR_API_KEY=${LINEAR_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      
      # Feature Flags
      - ENABLE_ANALYTICS=${ENABLE_ANALYTICS:-false}
      - ENABLE_MONITORING=${ENABLE_MONITORING:-false}
      - ENABLE_CACHE=${ENABLE_CACHE:-true}
      
    depends_on:
      - db
      - redis
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - spark-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`localhost`)"
      - "traefik.http.services.app.loadbalancer.server.port=3000"

  # =============================================================================
  # DATABASE SERVICE
  # =============================================================================
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=spark_db
      - POSTGRES_USER=spark
      - POSTGRES_PASSWORD=password
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - spark-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spark -d spark_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # REDIS SERVICE
  # =============================================================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    restart: unless-stopped
    networks:
      - spark-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # MONITORING SERVICES (Production Only)
  # =============================================================================
  prometheus:
    image: prom/prometheus:latest
    profiles:
      - monitoring
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - spark-network

  grafana:
    image: grafana/grafana:latest
    profiles:
      - monitoring
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    restart: unless-stopped
    networks:
      - spark-network
    depends_on:
      - prometheus

  # =============================================================================
  # REVERSE PROXY (Production)
  # =============================================================================
  traefik:
    image: traefik:v3.0
    profiles:
      - production
    command:
      - --api.dashboard=true
      - --api.debug=true
      - --log.level=INFO
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=helhum@hotmail.com
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt_data:/letsencrypt
    restart: unless-stopped
    networks:
      - spark-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.api.service=api@internal"

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  letsencrypt_data:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  spark-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16