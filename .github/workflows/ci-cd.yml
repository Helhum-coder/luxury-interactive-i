# GitHub Actions CI/CD Pipeline for Luxury Interactive
name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, staging, Verify-Wine-Cellar-Changes]
  pull_request:
    branches: [main]
  workflow_dispatch: # Allow manual triggers

env:
  NODE_VERSION: '20.x'
  PYTHON_VERSION: '3.11'
  CACHE_VERSION: v1

jobs:
  # =============================================================================
  # SETUP AND VALIDATION
  # =============================================================================
  setup:
    name: Setup and Validation
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.check-deploy.outputs.should-deploy }}
      environment: ${{ steps.check-deploy.outputs.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ env.CACHE_VERSION }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.CACHE_VERSION }}-

      - name: Install dependencies
        run: |
          npm ci --no-optional
          npm ls --depth=0

      - name: Validate package.json
        run: |
          node -e "
            const pkg = require('./package.json');
            console.log('✅ Package name:', pkg.name);
            console.log('✅ Version:', pkg.version);
            console.log('✅ Scripts available:', Object.keys(pkg.scripts));
            
            // Check for required scripts
            const requiredScripts = ['build', 'lint'];
            const missingScripts = requiredScripts.filter(script => !pkg.scripts[script]);
            if (missingScripts.length > 0) {
              console.error('❌ Missing required scripts:', missingScripts);
              process.exit(1);
            }
            console.log('✅ All required scripts present');
          "

      - name: Check deployment conditions
        id: check-deploy
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "should-deploy=true" >> $GITHUB_OUTPUT
            echo "environment=production" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "should-deploy=true" >> $GITHUB_OUTPUT
            echo "environment=staging" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "should-deploy=true" >> $GITHUB_OUTPUT
            echo "environment=development" >> $GITHUB_OUTPUT
          else
            echo "should-deploy=false" >> $GITHUB_OUTPUT
            echo "environment=none" >> $GITHUB_OUTPUT
          fi

  # =============================================================================
  # CODE QUALITY AND TESTING
  # =============================================================================
  quality-check:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    needs: setup
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restore cache
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ env.CACHE_VERSION }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci --no-optional

      - name: Lint code
        run: |
          echo "🔍 Running ESLint..."
          npm run lint -- --format=compact || {
            echo "⚠️ Linting completed with issues. Check output above."
            echo "This won't fail the build but should be addressed."
          }

      - name: Type checking
        run: |
          echo "🔍 Running TypeScript type check..."
          npx tsc --noEmit --skipLibCheck || {
            echo "⚠️ Type checking found issues. Continuing build..."
          }

      - name: Run tests
        run: |
          echo "🧪 Running test suite..."
          # Add test command when available
          echo "No test suite configured yet - skipping"
          # npm test || echo "Tests completed with issues"

      - name: Security audit
        run: |
          echo "🔒 Running security audit..."
          npm audit --audit-level=moderate || {
            echo "⚠️ Security vulnerabilities found. Please review:"
            npm audit --audit-level=moderate --json | jq '.vulnerabilities'
          }

  # =============================================================================
  # BUILD APPLICATION
  # =============================================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [setup, quality-check]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-optional

      - name: Build application
        run: |
          echo "🏗️ Building application..."
          export NODE_ENV=${{ needs.setup.outputs.environment }}
          export APP_ENV=${{ needs.setup.outputs.environment }}
          npm run build
        env:
          DEPLOYMENT_PLATFORM: github-actions

      - name: Verify build output
        run: |
          echo "✅ Checking build output..."
          if [ -d "dist" ]; then
            echo "Build directory exists"
            echo "Build size: $(du -sh dist/)"
            echo "Files in build:"
            find dist/ -type f -name "*.js" -o -name "*.css" -o -name "*.html" | head -10
          else
            echo "❌ Build directory not found"
            ls -la
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ github.sha }}
          path: dist/
          retention-days: 5

  # =============================================================================
  # DEPLOYMENT TO GITHUB PAGES
  # =============================================================================
  deploy-github-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [setup, build]
    if: needs.setup.outputs.should-deploy == 'true' && github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ github.sha }}
          path: dist/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v2
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v3

  # =============================================================================
  # DEPLOYMENT TO VERCEL (Optional)
  # =============================================================================
  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [setup, build]
    if: needs.setup.outputs.should-deploy == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    
    environment:
      name: vercel-${{ needs.setup.outputs.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ github.sha }}
          path: dist/

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        if: secrets.VERCEL_TOKEN != ''
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
          vercel-args: ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}

  # =============================================================================
  # DOCKER BUILD (Optional)
  # =============================================================================
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [setup, build]
    if: needs.setup.outputs.should-deploy == 'true' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: secrets.DOCKER_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ secrets.DOCKER_USERNAME != '' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/luxury-interactive:latest
            ${{ secrets.DOCKER_USERNAME }}/luxury-interactive:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================================================
  # NOTIFICATIONS AND CLEANUP
  # =============================================================================
  notify-success:
    name: Success Notification
    runs-on: ubuntu-latest
    needs: [deploy-github-pages, deploy-vercel, build-docker]
    if: always() && (needs.deploy-github-pages.result == 'success' || needs.deploy-vercel.result == 'success')
    
    steps:
      - name: Notify success
        run: |
          echo "🎉 Deployment completed successfully!"
          echo "📅 Date: $(date)"
          echo "🌟 Branch: ${{ github.ref }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"
          
          if [[ "${{ needs.deploy-github-pages.result }}" == "success" ]]; then
            echo "✅ GitHub Pages deployment successful"
          fi
          
          if [[ "${{ needs.deploy-vercel.result }}" == "success" ]]; then
            echo "✅ Vercel deployment successful"
          fi
          
          if [[ "${{ needs.build-docker.result }}" == "success" ]]; then
            echo "✅ Docker image built successfully"
          fi

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [deploy-github-pages, deploy-vercel, build-docker]
    if: always()
    
    steps:
      - name: Clean up artifacts
        run: |
          echo "🧹 Cleaning up temporary files and artifacts..."
          echo "Workflow completed at: $(date)"